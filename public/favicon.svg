<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <!-- Background Shield Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="60%" stop-color="#2d6a4f"/>
      <stop offset="95%" stop-color="#1b4332"/>
      <stop offset="100%" stop-color="#081c15"/>
    </radialGradient>
    
    <!-- Golden Key & Text Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdf0d5"/>
      <stop offset="25%" stop-color="#d4af37"/>
      <stop offset="65%" stop-color="#aa7c11"/>
      <stop offset="100%" stop-color="#5c4004"/>
    </linearGradient>
    
    <!-- Inner Chat Bubble Gradient -->
    <linearGradient id="leafGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1b4332"/>
      <stop offset="50%" stop-color="#40916c"/>
      <stop offset="100%" stop-color="#95d5b2"/>
    </linearGradient>
  </defs>

  <!-- Dark Green Circular Backdrop -->
  <circle cx="300" cy="250" r="160" fill="url(#bgGrad)" />

  <!-- Gold Chat Bubble (The Outer Bow of the Key) -->
  <path d="M 300 110 
           A 90 90 0 1 1 213 225 
           L 190 270 
           L 240 250 
           A 90 90 0 0 1 300 290 
           A 90 90 0 1 1 300 110 Z" 
        fill="none" stroke="url(#goldGrad)" stroke-width="20" stroke-linejoin="round"/>
        
  <!-- Inner Green Bubble -->
  <path d="M 300 130 
           A 70 70 0 1 1 233 220 
           L 215 255 
           L 255 240 
           A 70 70 0 0 1 300 270 
           A 70 70 0 1 1 300 130 Z" 
        fill="url(#leafGrad)"/>

  <!-- Inner Golden Arrow/Leaf Motif -->
  <path d="M 260 230 
           C 270 210, 290 200, 310 180 
           L 290 170 
           L 330 160 
           L 320 200 
           L 305 185 
           C 285 205, 275 220, 260 230 Z" 
        fill="url(#goldGrad)"/>

  <!-- Golden Key Shaft -->
  <rect x="288" y="290" width="24" height="40" fill="url(#goldGrad)" />
  <rect x="270" y="300" width="60" height="12" rx="4" fill="url(#goldGrad)" />
  
  <!-- The Golden Feather (Key Teeth) -->
  <path d="M 300 330 
           C 330 350, 330 420, 300 450 
           C 270 420, 270 350, 300 330 Z" 
        fill="url(#goldGrad)"/>
  
  <!-- Feather Detailing (The Quine & Barb Cuts) -->
  <path d="M 300 330 L 300 445" stroke="#5c4004" stroke-width="3" fill="none"/>
  <path d="M 300 360 L 315 345" stroke="#5c4004" stroke-width="2" fill="none"/>
  <path d="M 300 380 L 285 365" stroke="#5c4004" stroke-width="2" fill="none"/>
  <path d="M 300 400 L 315 385" stroke="#5c4004" stroke-width="2" fill="none"/>
  <path d="M 300 420 L 290 410" stroke="#5c4004" stroke-width="2" fill="none"/>

  <!-- The KeepChat Banner Text -->
  <text x="300" y="540" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="76" text-anchor="middle">
    <tspan fill="#1b4332">Keep</tspan><tspan fill="url(#goldGrad)">Chat</tspan>
  </text>
</svg>
